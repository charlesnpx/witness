name: CI

on:
  pull_request:

jobs:
  consumers:
    name: Consumer build check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/witness-consumer-go-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Build and vet consumers
        run: bash scripts/check-consumers.sh
